    <rect x="0" y="184" width="390" height="7" rx="3.5" fill="#f4bd33"/>
    <text x="0" y="240" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#53657c">流程图 · 数据图 · 模型图 · 全文插图套件</text>
    <g transform="translate(0 282)" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700">
      <rect width="82" height="42" rx="10" fill="#fff" stroke="#c9d7ea"/>
