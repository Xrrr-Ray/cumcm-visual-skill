      <rect x="182" width="72" height="42" rx="10" fill="#fff" stroke="#c9d7ea"/>
      <text x="218" y="27" text-anchor="middle" fill="#2457a7">PNG</text>
      <rect x="268" width="80" height="42" rx="10" fill="#fff" stroke="#c9d7ea"/>
      <text x="308" y="27" text-anchor="middle" fill="#2457a7">JSON</text>
