      <text x="372" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">结论解释</text>
      <path d="M262 216H299V132H314" fill="none" stroke="#2b62b4" stroke-width="2.4" marker-end="url(#arrow)"/>
      <path d="M372 156V184" stroke="#2b62b4" stroke-width="2.4" marker-end="url(#arrow)"/>
