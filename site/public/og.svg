      <text x="66" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">数据准备</text>
      <rect x="17" y="188" width="98" height="48" rx="9" fill="#fff" stroke="#9eb3cd"/>
      <text x="66" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">关系提炼</text>
      <path d="M66 156V184" stroke="#2b62b4" stroke-width="2.4" marker-end="url(#arrow)"/>

      <rect x="167" y="108" width="98" height="48" rx="9" fill="#eaf2ff" stroke="#5d8fd2"/>
      <text x="216" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#173f7a">模型构建</text>
      <path d="M132 132H163" stroke="#2b62b4" stroke-width="2.4" marker-end="url(#arrow)"/>
      <path d="M132 212H148V132H163" fill="none" stroke="#2b62b4" stroke-width="2.4" marker-end="url(#arrow)"/>
      <polygon points="216,184 262,216 216,248 170,216" fill="#fff" stroke="#2b62b4" stroke-width="2"/>
      <text x="216" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#172b4d">结果检验</text>
      <path d="M216 156V180" stroke="#2b62b4" stroke-width="2.4" marker-end="url(#arrow)"/>

