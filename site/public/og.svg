    <circle cx="50" cy="28" r="7" fill="#f5bf41"/>
    <circle cx="73" cy="28" r="7" fill="#32b56a"/>
    <rect x="116" y="16" width="304" height="24" rx="12" fill="#fff" stroke="#e0e7ef"/>

