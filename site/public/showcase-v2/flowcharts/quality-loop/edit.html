<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品批次质量检测与闭环处置流程｜编辑</title><style>
    :root{--bg:#f7f9fc;--surface:#ffffff;--ink:#162033;--muted:#5d6a7d;--accent:#2457a7;--accent-soft:#eaf1fb;--border:#9aabc2;--group-fill:#f2f6fb;--flow:#334155;--pass:#25845f;--reject:#c4513a;--feedback:#286bb5}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--ink)}
    .slide{width:100vw;height:100vh;overflow:hidden}.paper-visual{width:100vw;height:100vh;display:block;background:var(--bg)}
    .visual-title{font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif;font-size:46px;font-weight:700;fill:var(--ink);letter-spacing:.5px}.visual-subtitle{font-size:24px;fill:var(--muted)}
    .title-rule{stroke:var(--accent);stroke-width:6}
    .visual-group rect{fill:var(--group-fill);stroke:var(--border);stroke-width:1.5}.visual-group text{font-size:27px;font-weight:700;fill:var(--ink)}.group-index{fill:var(--accent);font-size:22px;letter-spacing:1px}
    .node-shape{fill:var(--surface);stroke:var(--border);stroke-width:2}.visual-node:focus .node-shape,.visual-node:hover .node-shape{stroke:var(--accent);stroke-width:3}.node-title{font-size:32px;font-weight:700;fill:var(--ink)}.node-detail{font-size:28px;fill:var(--muted)}.node-tag{font-size:20px;font-weight:700;fill:var(--accent)}
    .node-decision .node-shape{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}.node-pill .node-shape{fill:var(--accent);stroke:var(--accent)}.node-pill .node-title,.node-pill .node-detail{fill:#fff}
    .visual-edge path{fill:none;stroke:var(--flow);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.edge-pass path{stroke:var(--pass);stroke-width:3.5}.edge-reject path{stroke:var(--reject);stroke-width:3.5}.edge-feedback path{stroke:var(--feedback);stroke-width:3.5;stroke-dasharray:11 8}.edge-label-wrap rect{fill:var(--bg);stroke:none}.edge-label{font-size:28px;font-weight:700;fill:var(--ink)}
    .author-tools{display:none;position:fixed;right:16px;top:16px;bottom:16px;z-index:5;width:300px;overflow:auto;padding:16px;border:1px solid #cbd5e1;border-radius:14px;background:#fffffff2;color:#334155;font:14px/1.45 "Microsoft YaHei",sans-serif;box-shadow:0 10px 30px #0f172a2b;backdrop-filter:blur(10px)}
    .is-authoring .author-tools{display:block}.is-authoring .slide{position:fixed;left:0;top:0;width:calc(100vw - 332px);height:100vh}.is-authoring .paper-visual{width:100%;height:100%}.is-authoring .visual-node{cursor:grab}.is-authoring .visual-node:active{cursor:grabbing}.is-authoring .visual-node.editor-selected .node-shape{stroke:var(--accent);stroke-width:4}
    .author-tools h2{margin:0 0 4px;font-size:18px;color:#172033}.author-tools p{margin:0 0 12px;color:#64748b}.editor-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.editor-actions button,.editor-export button,.author-tools>[data-action=close]{border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#24324a;padding:8px 6px;font:600 12px/1.2 sans-serif;cursor:pointer}.editor-actions button:hover,.editor-export button:hover,.author-tools>[data-action=close]:hover{border-color:var(--accent);color:var(--accent)}.editor-fields{display:grid;gap:9px}.editor-fields label{display:grid;gap:4px;font-weight:700;color:#334155}.editor-fields input,.editor-fields textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 9px;background:#fff;color:#172033;font:14px/1.4 sans-serif}.editor-fields textarea{min-height:66px;resize:vertical}.editor-fields input:disabled,.editor-fields textarea:disabled{background:#f1f5f9;color:#94a3b8}.editor-divider{height:1px;margin:14px 0;background:#e2e8f0}.editor-export{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.editor-status{min-height:20px;margin-top:10px!important;font-size:12px}.editor-kbd{display:inline-block;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#f8fafc;font:12px/1.6 monospace;color:#334155}
    
    .author-tools{width:360px}
    .is-authoring .slide{width:calc(100vw - 392px)}
    .editor-object-type{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;background:#eaf1fb;color:#2457a7;font-weight:700}
    .editor-object-panel[hidden]{display:none}.editor-object-panel h3{margin:0 0 10px;font-size:15px;color:#172033}
    .editor-color-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.editor-color-grid label{font-size:12px}
    .editor-color-grid input[type=color]{height:34px;padding:3px}
    .editor-two-columns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .editor-fields select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 9px;background:#fff;color:#172033;font:14px/1.4 sans-serif}
    .editor-inline-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .editor-inline-actions button{border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#24324a;padding:8px 6px;font:600 12px/1.2 sans-serif;cursor:pointer}
    .editor-inline-actions button:hover{border-color:var(--accent);color:var(--accent)}
    .editor-snap-toggle{display:flex!important;grid-template-columns:auto 1fr!important;align-items:center;gap:8px!important;padding:9px 10px;border:1px solid #bfdbfe;border-radius:9px;background:#eff6ff;color:#1e40af!important}.editor-snap-toggle input{width:16px!important;height:16px;margin:0}
    .editor-overlay{display:none;pointer-events:none}.is-authoring .editor-overlay{display:block}
    .editor-snap-guide{stroke:#0ea5e9;stroke-width:2;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;opacity:.95}
    .editor-selection-outline{fill:none;stroke:#f97316;stroke-width:3;stroke-dasharray:10 7;vector-effect:non-scaling-stroke}
    .editor-resize-handle,.editor-route-handle,.editor-endpoint-handle{pointer-events:all;stroke:#fff;stroke-width:3;vector-effect:non-scaling-stroke}
    .editor-resize-handle{fill:#f97316;cursor:nwse-resize}.editor-route-handle{fill:#2563eb;cursor:move}.editor-endpoint-handle{fill:#16a34a;cursor:crosshair}
    .is-authoring .visual-group{cursor:move}.is-authoring .visual-edge path{cursor:pointer;pointer-events:stroke}
    .is-authoring .visual-group.editor-selected>rect{stroke:#f97316!important;stroke-width:3!important}
    .is-authoring .visual-edge.editor-selected>path{filter:drop-shadow(0 0 3px #f97316);stroke-width:max(4px,var(--edge-width,3px))}
  
    @media print{html,body{width:100%;height:100%;print-color-adjust:exact;-webkit-print-color-adjust:exact}.author-tools,.editor-overlay{display:none!important}}
  body{display:grid;place-items:center}.paper-visual{width:100vw;height:100vh}</style></head><body class="is-authoring"><aside class="author-tools" aria-label="论文图高级编辑器">
    <h2>论文图高级编辑器</h2>
    <p>可选择节点、分组框或连线；修改会自动保存在当前浏览器。</p>
    <div class="editor-actions">
      <button type="button" data-action="undo">撤销</button>
      <button type="button" data-action="redo">重做</button>
      <button type="button" data-action="reset">重置</button>
    </div>
    <div class="editor-fields">
      <label>图标题<input data-editor-field="title" type="text"></label>
      <label>副标题<input data-editor-field="subtitle" type="text"></label>
      <label class="editor-snap-toggle"><input data-editor-field="snap-enabled" type="checkbox" checked><span>智能吸附与参考线（按 Alt 临时关闭）</span></label>
    </div>
    <div class="editor-divider"></div>
    <p>当前对象：<span class="editor-object-type" data-editor-field="selected-type">未选择</span> <strong data-editor-field="selected-id"></strong></p>
    <section class="editor-object-panel" data-object-panel="none">
      <p>点击节点、分组背景框或连线进行编辑。</p>
    </section>
    <section class="editor-object-panel" data-object-panel="node" hidden>
      <h3>节点属性</h3>
      <div class="editor-fields">
        <label>节点标题<input data-editor-field="node-label" type="text"></label>
        <label>节点说明<textarea data-editor-field="node-detail"></textarea></label>
        <label>节点标签<input data-editor-field="node-tag" type="text"></label>
        <div class="editor-color-grid">
          <label>填充<input data-editor-field="node-fill" type="color"></label>
          <label>边框<input data-editor-field="node-stroke" type="color"></label>
          <label>文字<input data-editor-field="node-text-color" type="color"></label>
        </div>
      </div>
    </section>
    <section class="editor-object-panel" data-object-panel="group" hidden>
      <h3>分组背景框</h3>
      <div class="editor-fields">
        <label>分组标题<input data-editor-field="group-label" type="text"></label>
        <div class="editor-color-grid">
          <label>填充<input data-editor-field="group-fill" type="color"></label>
          <label>边框<input data-editor-field="group-stroke" type="color"></label>
          <label>文字<input data-editor-field="group-text-color" type="color"></label>
        </div>
        <div class="editor-two-columns">
          <label>X<input data-editor-field="group-x" type="number" step="1"></label>
          <label>Y<input data-editor-field="group-y" type="number" step="1"></label>
          <label>宽度<input data-editor-field="group-width" type="number" min="180" step="1"></label>
          <label>高度<input data-editor-field="group-height" type="number" min="120" step="1"></label>
        </div>
      </div>
    </section>
    <section class="editor-object-panel" data-object-panel="edge" hidden>
      <h3>连线与箭头</h3>
      <div class="editor-fields">
        <label>连线标签<input data-editor-field="edge-label" type="text"></label>
        <div class="editor-two-columns">
          <label>起始节点<select data-editor-field="edge-from"></select></label>
          <label>终止节点<select data-editor-field="edge-to"></select></label>
          <label>起始锚点<select data-editor-field="edge-start-anchor">
            <option value="auto">自动</option><option value="top">上</option><option value="right">右</option><option value="bottom">下</option><option value="left">左</option>
          </select></label>
          <label>终止锚点<select data-editor-field="edge-end-anchor">
            <option value="auto">自动</option><option value="top">上</option><option value="right">右</option><option value="bottom">下</option><option value="left">左</option>
          </select></label>
          <label>起点箭头<select data-editor-field="edge-start-arrow">
            <option value="none">无</option><option value="triangle">三角箭头</option><option value="dot">圆点</option><option value="diamond">菱形</option>
          </select></label>
          <label>终点箭头<select data-editor-field="edge-end-arrow">
            <option value="none">无</option><option value="triangle">三角箭头</option><option value="dot">圆点</option><option value="diamond">菱形</option>
          </select></label>
          <label>线型<select data-editor-field="edge-dash">
            <option value="solid">实线</option><option value="dashed">虚线</option><option value="dotted">点线</option>
          </select></label>
          <label>线宽<input data-editor-field="edge-width" type="number" min="1" max="12" step="0.5"></label>
        </div>
        <label>线条颜色<input data-editor-field="edge-color" type="color"></label>
      </div>
      <div class="editor-inline-actions">
        <button type="button" data-action="add-bend">增加折点</button>
        <button type="button" data-action="clear-bends">清除折点</button>
      </div>
      <p>蓝色控制点调整线路姿态；接近水平或垂直时自动吸附，按 Shift 强制锁定一个方向。绿色端点可拖到其他节点。</p>
    </section>
    <div class="editor-divider"></div>
    <div class="editor-export">
      <button type="button" data-action="export-svg">导出 SVG</button>
      <button type="button" data-action="export-png">导出 PNG</button>
      <button type="button" data-action="export-plan">导出 JSON</button>
    </div>
    <p class="editor-status">选择一个对象开始编辑</p>
    <p>按 <span class="editor-kbd">E</span> 显示/隐藏编辑器，<span class="editor-kbd">Ctrl+Z</span> 撤销。</p>
    <button type="button" data-action="close">隐藏编辑器</button>

        );
        value.x = Math.round(snapped.x * 10) / 10;
        value.y = Math.round(snapped.y * 10) / 10;
        activeGuides = snapped.guides;
      }
      if (drag.type === 'group-resize') {
        const value = state.groups[drag.id];
        const resized = snapResizePosition(
          drag.id,
          value.x + drag.width + point.x - drag.start.x,
          value.y + drag.height + point.y - drag.start.y,
          event.altKey
        );
        value.width = Math.max(180, Math.round((resized.right - value.x) * 10) / 10);
        value.height = Math.max(120, Math.round((resized.bottom - value.y) * 10) / 10);
        activeGuides = resized.guides;
      }
      if (drag.type === 'edge-route') {
        const snapped = snapRoutePoint(drag.id, drag.index, point, event.shiftKey, event.altKey);
        state.edges[drag.id].route[drag.index] = [Math.round(snapped.x * 10) / 10, Math.round(snapped.y * 10) / 10];
        activeGuides = snapped.guides;
      }
      if (drag.type === 'edge-endpoint') {
        drag.point = point;
        drag.handle.setAttribute('cx', point.x);
        drag.handle.setAttribute('cy', point.y);
        return;
      }
      applyState();
    });
    const finishDrag = () => {
      if (!drag) return;
      if (drag.type === 'edge-endpoint') {
        const target = nearestNode(drag.point);
        if (target) state.edges[drag.id][drag.endpoint] = target;
      }
      const changed = drag.before !== JSON.stringify(state);
      const message = {
        'node-move': '节点位置已保存',
        'group-move': '分组框位置已保存',
        'group-resize': '分组框尺寸已保存',
        'edge-route': '连线路径已保存',
        'edge-endpoint': '连线端点已保存'
      }[drag.type];
      drag = null;
      activeGuides = [];
      applyState();
      if (changed) commit(message);
    };
    svg.addEventListener('pointerup', finishDrag);
    svg.addEventListener('pointercancel', finishDrag);
    svg.addEventListener('dblclick', event => {
      const node = event.target.closest('[data-node-id]');
      const group = event.target.closest('[data-group-id]');
      const edge = event.target.closest('[data-edge-id]');
      if (node) {
        selectObject('node', node.dataset.nodeId);
        field('node-label').focus();
        field('node-label').select();
      } else if (group) {
        selectObject('group', group.dataset.groupId);
        field('group-label').focus();
        field('group-label').select();
      } else if (edge) {
        selectObject('edge', edge.dataset.edgeId);
        field('edge-label').focus();
        field('edge-label').select();
      }
    });
    const nodeOptions = sourcePlan.nodes.map(node => '<option value="' + String(node.id).replace(/"/g, '&quot;') + '">' + String(node.label || node.id).replace(/</g, '&lt;') + '</option>').join('');
    field('edge-from').innerHTML = nodeOptions;
    field('edge-to').innerHTML = nodeOptions;
    const globalFields = { title: 'title', subtitle: 'subtitle' };
    for (const [name, key] of Object.entries(globalFields)) {
      field(name).addEventListener('input', event => {
        state[key] = event.target.value;
        applyState();
        persist();
      });
      field(name).addEventListener('change', () => commit('标题已保存'));
    }
    field('snap-enabled').addEventListener('change', event => {
      setSnapEnabled(event.target.checked);
    });
    const nodeFields = {
      'node-label': 'label', 'node-detail': 'detail', 'node-tag': 'tag',
      'node-fill': 'fill', 'node-stroke': 'stroke', 'node-text-color': 'textColor'
    };
    for (const [name, key] of Object.entries(nodeFields)) {
      field(name).addEventListener('input', event => {
        if (selection.type !== 'node') return;
        state.nodes[selection.id][key] = event.target.value;
        applyState();
        persist();
      });
      field(name).addEventListener('change', () => commit('节点属性已保存'));
    }
    const groupFields = {
      'group-label': 'label', 'group-fill': 'fill', 'group-stroke': 'stroke',
      'group-text-color': 'textColor', 'group-x': 'x', 'group-y': 'y',
      'group-width': 'width', 'group-height': 'height'
    };
    for (const [name, key] of Object.entries(groupFields)) {
      field(name).addEventListener('input', event => {
        if (selection.type !== 'group') return;
        const numeric = ['x', 'y', 'width', 'height'].includes(key);
        state.groups[selection.id][key] = numeric ? Number(event.target.value) : event.target.value;
        if (key === 'width') state.groups[selection.id][key] = Math.max(180, state.groups[selection.id][key]);
        if (key === 'height') state.groups[selection.id][key] = Math.max(120, state.groups[selection.id][key]);
        applyState();
        persist();
      });
      field(name).addEventListener('change', () => commit('分组框属性已保存'));
    }
    const edgeFields = {
      'edge-label': 'label', 'edge-from': 'from', 'edge-to': 'to',
      'edge-start-anchor': 'startAnchor', 'edge-end-anchor': 'endAnchor',
      'edge-start-arrow': 'startArrow', 'edge-end-arrow': 'endArrow',
      'edge-dash': 'dash', 'edge-width': 'width', 'edge-color': 'color'
    };
    for (const [name, key] of Object.entries(edgeFields)) {
      field(name).addEventListener('input', event => {
        if (selection.type !== 'edge') return;
        state.edges[selection.id][key] = key === 'width' ? Number(event.target.value) : event.target.value;
        applyState();
        persist();
      });
      field(name).addEventListener('change', () => commit('连线属性已保存'));
    }
    action('close').addEventListener('click', () => setEditMode(false));
    action('undo').addEventListener('click', undo);
    action('redo').addEventListener('click', redo);
    action('reset').addEventListener('click', reset);
    action('add-bend').addEventListener('click', addBend);
    action('clear-bends').addEventListener('click', clearBends);
    action('export-svg').addEventListener('click', exportSvg);
    action('export-png').addEventListener('click', exportPng);
    action('export-plan').addEventListener('click', exportPlan);
    window.addEventListener('keydown', event => {
      const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
      if (!typing && event.key.toLowerCase() === 'e') setEditMode(!document.body.classList.contains('is-authoring'));
      if (!typing && event.key === 'Escape') selectObject('none', '');
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
        event.preventDefault();
        event.shiftKey ? redo() : undo();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'y') {
        event.preventDefault();
        redo();
      }
    });
    window.PaperVisual = {
      update: applyState, setEditMode, setSnapEnabled, selectObject, undo, redo, reset,
      addBend, clearBends, exportSvg, exportPng, exportPlan,
      getState: () => clone(state),
      testSnapBox: (type, id, x, y, width, height, disabled = false) => clone(snapBoxPosition(type, id, x, y, width, height, disabled)),
      testSnapRoute: (id, index, x, y, force = false, disabled = false) => clone(snapRoutePoint(id, index, { x, y }, force, disabled)),
      previewSnapBox: (type, id, x, y, width, height) => {
        const result = snapBoxPosition(type, id, x, y, width, height, false);
        activeGuides = result.guides;
        renderOverlay();
        return clone(result);
      }
    };
    applyState();
    if (new URLSearchParams(location.search).get('edit') === '1') setEditMode(true);
  })();
  </script></body></html>
